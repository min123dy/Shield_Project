[package]
name = "shield"
version = "1.1.0"
edition = "2021"

[dependencies]
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["zeroize"] }
sha2 = "0.10"
zeroize = "1"
rand = "0.8"
rand_chacha = "0.3"
sevenz-rust = { version = "0.6", features = ["compress"] }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.14"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]
resolver = "2"
