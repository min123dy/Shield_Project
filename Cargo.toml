[workspace]
resolver = "2"
members = ["crates/shield-platform", "crates/shield-core", "crates/shield-gui", "crates/shield-cli"]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
zeroize = "1"
sha3 = { version = "0.10", features = ["zeroize"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Tests run Argon2id (256 MiB) many times: keep the crypto crates optimised in debug test builds too.
[profile.dev.package."*"]
opt-level = 3
