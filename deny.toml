# cargo deny (3.1.0 #2; written for cargo-deny 0.20.2, the version CI installs). CI: `cargo deny --locked check advisories bans sources licenses`.
# The advisory ignores are the same as in .cargo/audit.toml (reasons there and in docs/05).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2023-0071", # rsa 0.9 (Marvin): pgp, public-key verification only
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 (timing): pgp, public-key verification only; 0.7.10 is patched
    "RUSTSEC-2026-0257", # webbrowser 0.8: egui-winit links; egui open_url requests are dropped
    "RUSTSEC-2024-0436", # paste 1.0 unmaintained: metal (macOS only)
    "RUSTSEC-2026-0192", # ttf-parser 0.25 unmaintained: egui font loading
    "RUSTSEC-2026-0371", # zbus_names 3 unmaintained: rfd -> ashpd -> zbus 4
    "RUSTSEC-2026-0370", # zvariant 4 unmaintained: rfd -> ashpd -> zbus 4
    "RUSTSEC-2026-0372", # zvariant_derive 4 unmaintained: rfd -> ashpd -> zbus 4
]

[bans]
# several versions of one crate are common in this graph (windows-sys, rand_core, ...): reported,
# not refused
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates come from crates.io only: no git or other registries
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
version = 2
# The licenses used by the dependency graph and this workspace. A new license makes the check
# fail so that somebody looks at it; this list is a record of what is in use, not a legal review.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later", # r-efi (one of its choices)
    "LicenseRef-UFL-1.0",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
