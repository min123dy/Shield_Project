# 3.1.0 #2: update proposals for the Rust dependencies and the pinned GitHub Actions (SHAs).
# Each proposal is a pull request that CI tests; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
