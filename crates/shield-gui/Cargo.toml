[package]
name = "shield-gui"
description = "Shield: egui windows (encryption window, container file manager, settings)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

# Windowed launcher (no console window): Explorer / file manager verbs, Start menu, .desktop file.
[[bin]]
name = "shield-gui"
path = "src/main.rs"

[dependencies]
shield-core = { path = "../shield-core" }
shield-platform = { path = "../shield-platform", features = ["display"] }
zeroize = { workspace = true }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.14"
# font metrics for the letter-size match between systems (already used by egui)
ab_glyph = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[dev-dependencies]
ab_glyph = "0.2"
sha3 = { workspace = true }

[build-dependencies]
winresource = "0.1"
