[package]
name = "shield-platform"
description = "Shield: operating-system specific services behind one trait (Windows, Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Monitor list and the X11 scale set-up for the windows (enabled by shield-gui). The console-only
# build leaves it out, so it has no X11 client code.
display = ["dep:x11rb"]

[dependencies]
dirs = "6"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
wmi = "0.18.4"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true, default-features = false, features = ["resource_manager", "randr"] }
